name: Validate Naiwa
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<14'
      - run: python scripts/install.py --check
      - run: python scripts/validate.py
